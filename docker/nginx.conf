server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Observabilidad SRS (Sección 6): dirigir logs a stdout/stderr sin archivos locales
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Ocultar versión de Nginx
    server_tokens off;

    # Endpoint público obligatorio de salud (Sección 4.7)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"esavi-frontend","timestamp":"$time_iso8601"}';
    }

    # Cabeceras de Ciberseguridad HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://api.cloudinary.com; frame-src 'self' blob: https://res.cloudinary.com https://drive.google.com; object-src 'self' blob:;" always;

    # Caché agresiva para assets estáticos con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Enrutamiento SPA (BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
